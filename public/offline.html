<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6d35e8">
  <title>You're offline · EventSphere</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fffdf9;color:#171522;font-family:Arial,Helvetica,sans-serif}
    main{max-width:460px;text-align:center}.mark{margin:0 auto 24px;width:64px;height:64px;border-radius:22px;background:#6d35e8;color:white;display:grid;place-items:center;font-size:30px}
    h1{font-size:32px;letter-spacing:-1px;margin:0 0 12px}p{color:#716d7c;line-height:1.7}
    button{border:0;border-radius:999px;background:#6d35e8;color:#fff;padding:14px 22px;font-weight:700;font-size:14px;cursor:pointer}
  </style>
</head>
<body><main><div class="mark">✦</div><h1>You're offline.</h1><p>EventSphere needs an internet connection to load this page. Check your connection and try again. Your saved app shell will be ready when you're back online.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
